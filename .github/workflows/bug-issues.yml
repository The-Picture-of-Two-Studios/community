name: bug-issues
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency: bug-issues
permissions: {}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node bot/bug-issues.mjs
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          ISSUES_TOKEN: ${{ secrets.ISSUES_TOKEN }}
